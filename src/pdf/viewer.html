<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PDF Viewer - Site Memory</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
    }
    
    #toolbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 48px;
      background: #0a0a0a;
      border-bottom: 1px solid #27272a;
      display: flex;
      align-items: center;
      padding: 0 16px;
      z-index: 100;
      gap: 12px;
    }
    
    #toolbar .title {
      color: #fafafa;
      font-size: 14px;
      font-weight: 500;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    #toolbar button {
      background: #27272a;
      border: none;
      border-radius: 6px;
      color: #a1a1aa;
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }
    
    #toolbar button:hover {
      background: #3f3f46;
      color: #fafafa;
    }
    
    #page-info {
      color: #71717a;
      font-size: 13px;
    }
    
    #viewer-container {
      position: fixed;
      top: 48px;
      left: 0;
      right: 0;
      bottom: 0;
      overflow: auto;
      background: #27272a;
    }
    
    #viewer {
      margin: 20px auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding-bottom: 40px;
    }
    
    .page-wrapper {
      background: white;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      position: relative;
    }
    
    .page-wrapper canvas {
      display: block;
    }
    
    .text-layer {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
      opacity: 0.2;
      line-height: 1.0;
    }
    
    .text-layer > span {
      color: transparent;
      position: absolute;
      white-space: pre;
      transform-origin: 0% 0%;
    }
    
    .text-layer ::selection {
      background: rgba(250, 204, 21, 0.4);
    }
    
    /* Highlights in PDF */
    .pdf-highlight {
      position: absolute;
      background: rgba(250, 204, 21, 0.35);
      border-radius: 2px;
      cursor: pointer;
      transition: background 0.15s;
    }
    
    .pdf-highlight:hover {
      background: rgba(250, 204, 21, 0.5);
    }
    
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a1a;
      color: #fafafa;
      font-size: 14px;
      z-index: 200;
    }
    
    #loading.hidden { display: none; }
    
    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid #27272a;
      border-top-color: #facc15;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 12px;
    }
    
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    Loading PDF...
  </div>
  
  <div id="toolbar">
    <span class="title" id="pdf-title">PDF Viewer</span>
    <span id="page-info">Page 1 of 1</span>
    <button id="zoom-out">−</button>
    <button id="zoom-in">+</button>
    <button id="sidebar-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/>
      </svg>
      Highlights
    </button>
  </div>
  
  <div id="viewer-container">
    <div id="viewer"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    // Configure PDF.js worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    
    const urlParams = new URLSearchParams(window.location.search);
    const pdfUrl = urlParams.get('file');
    
    let pdfDoc = null;
    let scale = 1.2;
    let currentHighlights = [];
    
    // Load PDF
    async function loadPdf() {
      if (!pdfUrl) {
        document.getElementById('loading').innerHTML = 'No PDF specified';
        return;
      }
      
      try {
        // Decode the URL
        const decodedUrl = decodeURIComponent(pdfUrl);
        document.getElementById('pdf-title').textContent = decodedUrl.split('/').pop();
        
        pdfDoc = await pdfjsLib.getDocument(decodedUrl).promise;
        document.getElementById('page-info').textContent = `${pdfDoc.numPages} pages`;
        
        // Render all pages
        const viewer = document.getElementById('viewer');
        
        for (let i = 1; i <= pdfDoc.numPages; i++) {
          await renderPage(i, viewer);
        }
        
        document.getElementById('loading').classList.add('hidden');
        
        // Load saved highlights
        loadHighlights();
        
        // Setup selection handling
        setupSelection();
        
      } catch (err) {
        console.error('Failed to load PDF:', err);
        document.getElementById('loading').innerHTML = 'Failed to load PDF: ' + err.message;
      }
    }
    
    // Render a page
    async function renderPage(pageNum, container) {
      const page = await pdfDoc.getPage(pageNum);
      const viewport = page.getViewport({ scale });
      
      // Create wrapper
      const wrapper = document.createElement('div');
      wrapper.className = 'page-wrapper';
      wrapper.dataset.page = pageNum;
      wrapper.style.width = viewport.width + 'px';
      wrapper.style.height = viewport.height + 'px';
      
      // Canvas for rendering
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      wrapper.appendChild(canvas);
      
      // Text layer for selection
      const textLayer = document.createElement('div');
      textLayer.className = 'text-layer';
      wrapper.appendChild(textLayer);
      
      container.appendChild(wrapper);
      
      // Render page
      const ctx = canvas.getContext('2d');
      await page.render({ canvasContext: ctx, viewport }).promise;
      
      // Get text content
      const textContent = await page.getTextContent();
      
      // Render text layer
      for (const item of textContent.items) {
        const span = document.createElement('span');
        span.textContent = item.str;
        
        const tx = pdfjsLib.Util.transform(viewport.transform, item.transform);
        const fontSize = Math.sqrt(tx[0] * tx[0] + tx[1] * tx[1]);
        
        span.style.left = tx[4] + 'px';
        span.style.top = (viewport.height - tx[5]) + 'px';
        span.style.fontSize = fontSize + 'px';
        span.style.fontFamily = item.fontName || 'sans-serif';
        
        textLayer.appendChild(span);
      }
    }
    
    // Setup text selection for highlighting
    function setupSelection() {
      document.addEventListener('mouseup', (e) => {
        const selection = window.getSelection();
        if (!selection || selection.isCollapsed) return;
        
        const text = selection.toString().trim();
        if (text.length < 2) return;
        
        // Get the page number
        const range = selection.getRangeAt(0);
        const pageWrapper = range.startContainer.parentElement?.closest('.page-wrapper');
        const pageNum = pageWrapper ? parseInt(pageWrapper.dataset.page) : 1;
        
        // Save highlight
        saveHighlight(text, pageNum);
        
        selection.removeAllRanges();
      });
    }
    
    // Save highlight
    function saveHighlight(text, pageNum) {
      const highlight = {
        id: 'hl_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
        text,
        color: '#facc15',
        note: '',
        pageNum,
        pageId: pdfUrl,
        pageTitle: document.getElementById('pdf-title').textContent,
        url: window.location.href,
        favicon: '',
        createdAt: Date.now(),
        isPdf: true
      };
      
      // Send to storage via parent window or background
      chrome.storage.local.get(['site_memory_data'], (result) => {
        const data = result.site_memory_data || { highlights: [] };
        data.highlights.push(highlight);
        chrome.storage.local.set({ site_memory_data: data }, () => {
          console.log('Highlight saved');
          currentHighlights.push(highlight);
          showToast('Highlight saved');
        });
      });
    }
    
    // Load highlights for this PDF
    function loadHighlights() {
      chrome.storage.local.get(['site_memory_data'], (result) => {
        const data = result.site_memory_data || { highlights: [] };
        currentHighlights = data.highlights.filter(h => h.pageId === pdfUrl);
        console.log('Loaded', currentHighlights.length, 'highlights');
      });
    }
    
    // Show toast
    function showToast(msg) {
      const toast = document.createElement('div');
      toast.style.cssText = `
        position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
        background: #18181b; border: 1px solid #27272a; border-radius: 8px;
        padding: 10px 16px; color: #fafafa; font-size: 13px; z-index: 1000;
      `;
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2000);
    }
    
    // Zoom controls
    document.getElementById('zoom-in').addEventListener('click', () => {
      scale += 0.2;
      rerender();
    });
    
    document.getElementById('zoom-out').addEventListener('click', () => {
      scale = Math.max(0.5, scale - 0.2);
      rerender();
    });
    
    async function rerender() {
      const viewer = document.getElementById('viewer');
      viewer.innerHTML = '';
      for (let i = 1; i <= pdfDoc.numPages; i++) {
        await renderPage(i, viewer);
      }
    }
    
    // Sidebar button - communicate with extension
    document.getElementById('sidebar-btn').addEventListener('click', () => {
      // Try to toggle sidebar
      chrome.runtime.sendMessage({ action: 'toggleSidebar' });
    });
    
    // Initialize
    loadPdf();
  </script>
</body>
</html>
