<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Site Memory - PDF Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0f0f0f;
      color: #fafafa;
      min-height: 100vh;
    }
    
    /* Toolbar */
    .toolbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 52px;
      background: #18181b;
      border-bottom: 1px solid #27272a;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      z-index: 100;
    }
    
    .toolbar-title {
      flex: 1;
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .toolbar-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: #27272a;
      border: none;
      border-radius: 6px;
      color: #a1a1aa;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
    }
    
    .toolbar-btn:hover {
      background: #3f3f46;
      color: #fafafa;
    }

    .toolbar-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .toolbar-btn:disabled:hover {
      background: #27272a;
      color: #a1a1aa;
    }
    
    .toolbar-btn.primary {
      background: #facc15;
      color: #0a0a0a;
    }
    
    .toolbar-btn.primary:hover {
      background: #fbbf24;
    }
    
    .page-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #71717a;
      font-size: 13px;
    }
    
    .page-nav input {
      width: 50px;
      padding: 6px 8px;
      background: #0a0a0a;
      border: 1px solid #27272a;
      border-radius: 4px;
      color: #fafafa;
      font-size: 13px;
      text-align: center;
    }
    
    /* Viewer container */
    .viewer-container {
      padding-top: 52px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #27272a;
    }
    
    /* Page container */
    .page-container {
      margin: 20px auto;
      background: white;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      position: relative;
    }
    
    .page-container canvas {
      display: block;
    }
    
    /* Text layer for selection */
    .text-layer {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
      line-height: 1.0;
      pointer-events: auto;
    }
    
    .text-layer > span {
      color: transparent;
      position: absolute;
      white-space: pre;
      cursor: text;
      transform-origin: 0% 0%;
    }
    
    .text-layer ::selection {
      background: rgba(250, 204, 21, 0.4);
    }
    
    /* Loading state */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 52px);
      gap: 16px;
    }
    
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #27272a;
      border-top-color: #facc15;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .loading-text {
      color: #71717a;
      font-size: 14px;
    }
    
    /* Error state */
    .error {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 52px);
      padding: 40px;
      padding-top: 52px;
      text-align: center;
    }
    
    .error-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    
    .error h2 {
      font-size: 20px;
      margin-bottom: 8px;
    }
    
    .error p {
      color: #71717a;
      font-size: 14px;
      max-width: 400px;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    
    /* Highlight popup */
    .hl-popup {
      position: fixed;
      z-index: 1000;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 10px;
      padding: 8px;
      display: none;
      gap: 6px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }
    
    .hl-popup.visible {
      display: flex;
    }
    
    .hl-popup .color-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.1s;
    }
    
    .hl-popup .color-btn:hover {
      transform: scale(1.15);
    }
    
    .hl-popup .color-btn.active {
      border-color: white;
    }
    
    .hl-popup .action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      background: #27272a;
      border: none;
      border-radius: 6px;
      color: #a1a1aa;
      cursor: pointer;
      margin-left: 4px;
    }
    
    .hl-popup .action-btn:hover {
      background: #3f3f46;
      color: #fafafa;
    }
    
    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 12px 20px;
      color: #fafafa;
      font-size: 13px;
      z-index: 1001;
      animation: toastIn 0.3s ease;
    }
    
    @keyframes toastIn {
      from { opacity: 0; transform: translateX(-50%) translateY(10px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    
    /* Hidden */
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="toolbar">
    <span class="toolbar-title" id="title">Loading PDF...</span>
    <div class="page-nav">
      <button class="toolbar-btn" id="prevPage">←</button>
      <input type="number" id="pageNum" value="1" min="1">
      <span>/ <span id="totalPages">1</span></span>
      <button class="toolbar-btn" id="nextPage">→</button>
    </div>
    <button class="toolbar-btn" id="zoomOut">−</button>
    <span id="zoomLabel" style="font-size:12px;color:#71717a;min-width:38px;text-align:center;">130%</span>
    <button class="toolbar-btn" id="zoomIn">+</button>
  </div>
  
  <div class="viewer-container" id="viewer">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <span class="loading-text">Loading PDF...</span>
    </div>
  </div>
  
  <div class="error hidden" id="error">
    <span class="error-icon">😕</span>
    <h2>Couldn't load PDF</h2>
    <p id="errorMsg">There was a problem loading this PDF.</p>
    <button class="toolbar-btn primary" onclick="location.reload()">Try Again</button>
  </div>
  
  <!-- Highlight popup -->
  <div class="hl-popup" id="hlPopup">
    <button class="color-btn active" data-color="#facc15" style="background:#facc15"></button>
    <button class="color-btn" data-color="#4ade80" style="background:#4ade80"></button>
    <button class="color-btn" data-color="#60a5fa" style="background:#60a5fa"></button>
    <button class="color-btn" data-color="#f472b6" style="background:#f472b6"></button>
    <button class="color-btn" data-color="#c084fc" style="background:#c084fc"></button>
    <button class="action-btn" id="saveHighlight" title="Save">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </button>
  </div>

  <!-- Load PDF.js from extension's local files -->
  <script src="pdf.min.js"></script>
  <script src="viewer-script.js"></script>
</body>
</html>
